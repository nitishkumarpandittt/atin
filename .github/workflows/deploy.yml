# Deploys master to the production VPS after every push by running deploy/deploy.sh over SSH.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     the server's IP or hostname
#   DEPLOY_USER     the SSH user that owns the checkout (root on the current server)
#   DEPLOY_SSH_KEY  a private key whose public half is in that user's ~/.ssh/authorized_keys
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a second push waits for the first to finish rather than racing it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_DIR: ${{ vars.DEPLOY_APP_DIR || '/var/www/atin/app' }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$APP_DIR/deploy/deploy.sh"

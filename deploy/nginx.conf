# Atin HealthCare — nginx reverse proxy for the Next.js server on 127.0.0.1:3100.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/atin
#   sudo ln -s /etc/nginx/sites-available/atin /etc/nginx/sites-enabled/atin
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is HTTP only on purpose: `sudo certbot --nginx -d atinhealthcare.com -d www.atinhealthcare.com`
# rewrites it into an HTTPS block (copying the location rules below) and adds the HTTP->HTTPS redirect.
# Starting with TLS lines here would stop nginx booting before the certificate exists.

upstream atin_app {
  server 127.0.0.1:3100;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name atinhealthcare.com www.atinhealthcare.com;

  # Admin image uploads. Must stay above MAX_UPLOAD_MB + 1 (the Server Action body limit in next.config.ts).
  client_max_body_size 8m;

  # Next already gzips HTML; these cover the rest.
  gzip on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Immutable build assets: hashed filenames, safe to cache hard at the edge of the proxy.
  location /_next/static/ {
    proxy_pass http://atin_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://atin_app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # better-auth builds cookie/redirect origins from these; wrong values break admin sign-in over HTTPS.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;
  }
}
